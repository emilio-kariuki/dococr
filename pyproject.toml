[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dococr"
version = "0.1.0"
description = "Extract the fields you ask for from photos of documents (logbooks, driving licences, national IDs, ...)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pillow>=10",
    "numpy>=1.24",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "typer>=0.12",
    # Offline OCR engine. Pinned to the 3.10 series because dococr reads the model files that
    # ship inside this wheel (see src/dococr/ocr/rapid.py) and never downloads any.
    "rapidocr>=3.10,<3.11",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.8",
    # Renders PDF pages to images (bundles the PDFium library; permissive licence). Imported only
    # when a PDF is read, so commands that read no document do not load it.
    "pypdfium2>=5,<6",
]

[project.optional-dependencies]
# HTTP service.
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
all = ["dococr[api]"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
dococr = "dococr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dococr = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real OCR model"]

[tool.ruff]
line-length = 100
target-version = "py310"
